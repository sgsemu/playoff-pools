{% extends "base.html" %}
{% block title %}Reset Password - Playoff Pools{% endblock %}
{% block content %}
<div class="auth-form">
    <h1>Reset Password</h1>
    <form method="POST" action="/reset/{{ token }}">
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required minlength="6" autofocus>
        </div>
        <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
    <p class="auth-link"><a href="/login">Back to login</a></p>
</div>
{% endblock %}
