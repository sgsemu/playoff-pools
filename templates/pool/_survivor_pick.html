{% extends "base.html" %}
{% block title %}Pick - {{ pool.name }}{% endblock %}
{% block content %}
<div class="spick-page">
    <h1>{{ pool.name }} — Make Your Pick</h1>
    <a class="spick-back-link" href="/pool/{{ pool_id }}/survivor">← Status board</a>

    {% include "pool/_survivor_pick_section.html" with context %}
</div>
{% endblock %}

{% block scripts %}
<script>
    window.POOL_ID = {{ pool_id | tojson }};
    window.CURRENT_WEEK = {{ data.week | tojson }};
    window.INITIAL_PICK_DATA = {{ data | tojson }};
</script>
<script src="/static/js/survivor.js"></script>
{% endblock %}
